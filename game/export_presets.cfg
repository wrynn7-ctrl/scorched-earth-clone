; Craterline Android export (non-Gradle, prebuilt Godot 4.7.2 templates; Gradle builds come in a later milestone).
; Only the "Android" preset exists. Build it with tools/build_android_debug.sh.
; Min/target SDK: Godot only accepts overrides when "Use Gradle Build" is on, so they are left empty here. The prebuilt
; 4.7.2 templates are compiled with minSdk 24 and targetSdk 36 (compileSdk 36). Set gradle_build/min_sdk="26" and
; gradle_build/target_sdk="36" when Gradle builds are enabled.
; package/unique_name MUST be final before the first Play upload: it can never change afterwards.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/craterline-debug.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.2.0-dev"
package/unique_name="com.wrynn7.craterline"
