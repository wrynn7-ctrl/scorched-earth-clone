; Craterline Android export. Both presets use Gradle builds (needed for the Google Play Billing plugin, see docs/BUILD.md).
;   "Android"          -> APK for phones and CI (tools/build_android_debug.sh, --export-debug, debug key)
;   "Android Release"  -> AAB for Google Play (tools/build_android_release.sh, --export-release; signed with the public
;                         debug key until the real upload key arrives in milestone M8; never upload that to Play)
; Min SDK 26, target SDK 36 (Godot 4.7.2's template compiles against 36). Keep the two presets identical except for
; the name, export_path and gradle_build/export_format. Keystore settings are deliberately NOT stored here: the scripts
; pass them through GODOT_ANDROID_KEYSTORE_* environment variables, so no secret can end up in git.
; The billing plugin is enabled in project.godot ([editor_plugins]); it adds its AAR and the Play Billing dependency.
; exclude_filter keeps the unit tests, GUT and the (editor-only) billing export script out of the shipped package.
; package/unique_name MUST be final before the first Play upload: it can never change afterwards.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, addons/gut/*, addons/GodotGooglePlayBilling/export_plugin.gd"
export_path="../build/craterline-debug.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

