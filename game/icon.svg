<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Charred Horizons launcher icon: a tank silhouette on a burning synthwave horizon. Key content stays inside the
       central 66% (the Android adaptive-icon safe zone). Layers: icon_background.svg + icon_foreground.svg. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0618"/><stop offset="0.55" stop-color="#2b0b3d"/><stop offset="1" stop-color="#8a1530"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff07a"/><stop offset="0.38" stop-color="#ffb02a"/>
      <stop offset="0.7" stop-color="#ff5a14"/><stop offset="1" stop-color="#d4102a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a1a" stop-opacity="0.55"/><stop offset="1" stop-color="#ff2b6a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="above"><rect x="0" y="0" width="128" height="84"/></clipPath>
  </defs>
  <rect width="128" height="128" fill="url(#sky)"/>
