# Continuous integration: unit tests, then a debug-signed Android APK (Gradle build, with the Google Play Billing plugin).
# On pushes to the dev branch the APK is also published to the rolling pre-release `dev-latest`
# (one fixed page to download from on a phone), and a release-style AAB is built and kept as a workflow artifact only.
# The AAB is signed with the public debug key (NOT a Play upload key) until real signing arrives in M8.
name: CI

on:
  push:
    branches: ["**"]   # branches only; tag pushes (such as dev-latest) do not run CI
  pull_request:

# Least privilege by default. Only the `publish-dev-release` job gets `contents: write`.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on the dev branch half-way through publishing the release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/claude/artillery-game-android-69i6of' }}

env:
  GODOT_VERSION: "4.7.2"
  TOOLS_TAG: tools-godot-4.7.2
  # Shared runners are slower and noisier than a dev machine: widen wall-clock test budgets.
  PERF_BUDGET_SCALE: "3"

defaults:
  run:
    shell: bash   # GitHub runs this as `bash -e -o pipefail`, so any failing command fails the step

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false   # let every leg finish so one run shows all the failures
      matrix:
        include:
          - name: core
            suites: core
          - name: qa
            suites: qa
          - name: ai
            suites: ai
          - name: show+ui
            suites: show,ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Static check, needs no Godot: run it first so a rule violation fails in seconds.
      - name: Determinism check (game/core)
        if: matrix.name == 'core'
        run: tools/check_core_determinism.sh

      - name: Download Godot ${{ env.GODOT_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TOOLS_TAG" --repo "${{ github.repository }}" \
            --pattern "godot-${GODOT_VERSION}-linux.x86_64.zip" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/godot-dl"
          (cd "$RUNNER_TEMP/godot-dl" && grep " godot-${GODOT_VERSION}-linux.x86_64.zip\$" SHA256SUMS.txt | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot-dl/godot-${GODOT_VERSION}-linux.x86_64.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      # No cache for game/.godot: the import cache is cheap to rebuild and a stale one can hide script-class errors.
      # A new directory under game/tests needs a new matrix leg (the test-coverage job below fails the build otherwise).
      - name: Run GUT tests (${{ matrix.suites }})
        run: tools/run_tests.sh --suite "${{ matrix.suites }}"

  # Guard: fail if a test directory exists that no matrix leg runs, so tests can never be silently skipped.
  test-coverage:
    name: Every test directory is in the matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Compare game/tests/* with the matrix
        run: |
          covered="core qa show ui ai"
          for d in game/tests/*/; do
            n="$(basename "$d")"
            case " $covered " in
              *" $n "*) ;;
              *) echo "::error::game/tests/$n is not run by any CI matrix leg; add it to the test matrix in ci.yml"; exit 1 ;;
            esac
          done

  # Online backend (ARCHITECTURE section 43): lint, typecheck, then the rules and functions tests against the local Firebase
  # emulators (project "demo-craterline": fully offline, no credentials, no real Firebase project). Independent of the Godot jobs.
  firebase:
    name: Firebase (rules + functions + emulators)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            firebase/functions/package-lock.json

      # The database emulator is a Java program.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      # firebase-tools downloads the database emulator jar on first use; keep it between runs.
      - name: Cache Firebase emulators
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase/package-lock.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund --prefix firebase
          npm ci --no-audit --no-fund --prefix firebase/functions

      # Static checks (generated files up to date, typecheck, eslint, build), rules tests, functions tests.
      - name: Firebase tests
        run: tools/firebase/test.sh

  android-debug:
    name: Android debug APK
    needs: [test, test-coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot ${{ env.GODOT_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TOOLS_TAG" --repo "${{ github.repository }}" \
            --pattern "godot-${GODOT_VERSION}-linux.x86_64.zip" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/godot-dl"
          (cd "$RUNNER_TEMP/godot-dl" && grep " godot-${GODOT_VERSION}-linux.x86_64.zip\$" SHA256SUMS.txt | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot-dl/godot-${GODOT_VERSION}-linux.x86_64.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      # Gradle downloads (Gradle itself, the Android Gradle Plugin, Play Billing, ...) are cached. The key changes when the
      # Godot version, the billing pin or the export presets change; an older cache still seeds the next one.
      - name: Cache Gradle downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-apk-${{ hashFiles('tools/android/common.sh', 'tools/billing/pin.env', 'game/export_presets.cfg', 'tools/plugins/pin.env', 'android_plugins/**/*.gradle', 'android_plugins/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-apk-

      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android_plugins/google-services.json
            echo "Firebase config written: push is built in"
          else
            echo "No GOOGLE_SERVICES_JSON secret: push is built as a stub"
          fi

      # Installs the export templates and the pinned Android SDK pieces if the runner image lacks them,
      # writes the Godot editor settings, installs the Gradle build template (game/android, generated), exports,
      # then verifies the signature and that the billing plugin is inside the APK.
      - name: Build debug APK (Gradle)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/build_android_debug.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: craterline-debug-apk
          path: build/craterline-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Release-style AAB: proves the release pipeline (release templates, shrinking, billing plugin, bundle format).
  # Dev branch pushes only, runs in parallel with the APK job, and is kept as an artifact only (never published).
  # Signed with the PUBLIC DEBUG KEY: Play Console would reject it. Real signing: milestone M8.
  android-release-aab:
    name: Android release AAB (debug-signed, not for Play)
    needs: [test, test-coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/artillery-game-android-69i6of'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot ${{ env.GODOT_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TOOLS_TAG" --repo "${{ github.repository }}" \
            --pattern "godot-${GODOT_VERSION}-linux.x86_64.zip" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/godot-dl"
          (cd "$RUNNER_TEMP/godot-dl" && grep " godot-${GODOT_VERSION}-linux.x86_64.zip\$" SHA256SUMS.txt | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot-dl/godot-${GODOT_VERSION}-linux.x86_64.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Cache Gradle downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-aab-${{ hashFiles('tools/android/common.sh', 'tools/billing/pin.env', 'game/export_presets.cfg', 'tools/android/fetch_bundletool.sh', 'tools/plugins/pin.env', 'android_plugins/**/*.gradle', 'android_plugins/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-aab-

      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android_plugins/google-services.json
            echo "Firebase config written: push is built in"
          else
            echo "No GOOGLE_SERVICES_JSON secret: push is built as a stub"
          fi

      # Exports the AAB, checks the layout, the (debug) signature, the billing classes and runs `bundletool validate`.
      - name: Build release AAB (Gradle)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/build_android_release.sh

      - name: Upload AAB artifact (not published anywhere)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: craterline-release-aab-debug-signed
          path: build/craterline-release.aab
          if-no-files-found: error
          retention-days: 14

  publish-dev-release:
    name: Publish dev-latest pre-release
    needs: [android-debug, firebase]
    # Pushes to the dev branch only (never pull requests, never other branches).
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/artillery-game-android-69i6of'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: craterline-debug-apk
          path: dist

      - name: Create or update the dev-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG=dev-latest
          APK=dist/craterline-debug.apk
          test -s "$APK"
          SHORT="${SHA:0:7}"
          NOW="$(date -u '+%Y-%m-%d %H:%M UTC')"
          TITLE="Latest test build (dev)"
          printf '%s\n' \
            "Debug build of the dev branch, signed with the public debug key (installs over the previous test build)." \
            "" \
            "- Commit: ${SHA} (${SHORT})" \
            "- Built: ${NOW}" \
            "- Branch: ${GITHUB_REF_NAME}" \
            "- Workflow run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}" \
            "" \
            "Download \`craterline-debug.apk\` below. See docs/INSTALL_ON_PHONE.md for install steps." \
            > "$RUNNER_TEMP/notes.md"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # Move the tag to this commit, delete the old asset(s), upload the new one, refresh title and notes.
            gh api -X PATCH "repos/${REPO}/git/refs/tags/${TAG}" -f sha="$SHA" -F force=true >/dev/null
            gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              gh release delete-asset "$TAG" "$name" --repo "$REPO" --yes
            done
            gh release upload "$TAG" "$APK" --repo "$REPO"
            gh release edit "$TAG" --repo "$REPO" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" \
              --prerelease --latest=false
          else
            gh release create "$TAG" "$APK" --repo "$REPO" --target "$SHA" \
              --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false
          fi
          echo "Published: ${GITHUB_SERVER_URL}/${REPO}/releases/tag/${TAG}"
