plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def pins = rootProject.ext.pins

android {
    namespace 'com.wrynn7.craterline.plugin.signin'
}

apply from: '../plugin-common.gradle'

dependencies {
    // Compile-time only: the export plugin (game/addons/craterline_android) adds the same pinned versions to the game's
    // own Gradle build, together with credentials-play-services-auth (needed at runtime, not to compile).
    compileOnly "androidx.credentials:credentials:${pins.getProperty('CREDENTIALS_VERSION')}"
    compileOnly "com.google.android.libraries.identity.googleid:googleid:${pins.getProperty('GOOGLEID_VERSION')}"
}
