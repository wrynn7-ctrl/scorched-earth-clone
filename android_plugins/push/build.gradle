plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def pins = rootProject.ext.pins
def fcm = rootProject.ext.fcmEnabled
def generatedRes = layout.buildDirectory.dir('generated/firebase/res')

android {
    namespace 'com.wrynn7.craterline.plugin.push'
    sourceSets {
        main {
            // Two flavours of the same plugin, picked by whether google-services.json exists:
            //   fcm:   real Firebase Cloud Messaging code, the messaging service, the generated Firebase resources
            //   nofcm: a stub; the AAR references no Firebase class at all (nothing to strip or shrink in the app)
            java.srcDir(fcm ? 'src/fcm/kotlin' : 'src/nofcm/kotlin')
            manifest.srcFile(fcm ? 'src/fcm/AndroidManifest.xml' : 'src/nofcm/AndroidManifest.xml')
            if (fcm) {
                res.srcDir(generatedRes)
            }
        }
    }
}

apply from: '../plugin-common.gradle'

if (fcm) {
    dependencies {
        compileOnly "com.google.firebase:firebase-messaging:${pins.getProperty('FIREBASE_MESSAGING_VERSION')}"
    }
}

// google-services.json -> the Android string resources that Firebase's own initializer reads at process start
// (what the Google Services Gradle plugin would generate). Doing it here means the game's Gradle build needs no extra
// Gradle plugin, and the messaging service works even when a push starts the process before the game does.
def generateTask = tasks.register('generateFirebaseValues') {
    def jsonFile = rootProject.ext.googleServicesFile
    def appPackage = rootProject.ext.appPackage
    def outDir = generatedRes
    inputs.files(jsonFile.isFile() ? [jsonFile] : [])
    inputs.property('appPackage', appPackage)
    outputs.dir(outDir)
    onlyIf { fcm }
    doLast {
        def root = new groovy.json.JsonSlurper().parse(jsonFile)
        def info = root.project_info ?: [:]
        def clients = (root.client ?: [])
        def client = appPackage.isEmpty() ? (clients ? clients[0] : null) :
                clients.find { it.client_info?.android_client_info?.package_name == appPackage }
        if (client == null) {
            def have = clients.collect { it.client_info?.android_client_info?.package_name }
            throw new GradleException("${jsonFile} has no Android app for package '${appPackage}' (it has: ${have}). " +
                "Add that package in the Firebase console and download google-services.json again (docs/FIREBASE_SETUP.md).")
        }
        def esc = { String s -> s.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace("'", "\\'").replace('"', '\\"') }
        def values = [
            google_app_id            : client.client_info?.mobilesdk_app_id,
            gcm_defaultSenderId      : info.project_number,
            google_api_key           : client.api_key ? client.api_key[0].current_key : null,
            google_crash_reporting_api_key: client.api_key ? client.api_key[0].current_key : null,
            project_id               : info.project_id,
            firebase_database_url    : info.firebase_url,
            google_storage_bucket    : info.storage_bucket,
        ]
        def web = (client.oauth_client ?: []).find { it.client_type == 3 }
        if (web?.client_id) {
            values.default_web_client_id = web.client_id
        }
        ['google_app_id', 'gcm_defaultSenderId', 'google_api_key', 'project_id'].each { k ->
            if (!values[k]) {
                throw new GradleException("${jsonFile}: '${k}' is missing; download a fresh google-services.json")
            }
        }
        def dir = new File(outDir.get().asFile, 'values')
        dir.mkdirs()
        def sb = new StringBuilder("<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!-- generated by android_plugins/push/build.gradle from google-services.json; do not edit -->\n<resources>\n")
        values.each { k, v ->
            if (v) {
                sb << "    <string name=\"${k}\" translatable=\"false\" templateMergeStrategy=\"preserve\">${esc(v.toString())}</string>\n"
            }
        }
        sb << "</resources>\n"
        new File(dir, 'firebase_config.xml').text = sb.toString()
    }
}
tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn(generateTask)
    dependsOn(rootProject.tasks.named('verifyPins'))
}
