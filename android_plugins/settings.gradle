// Craterline Android plugins for Godot 4.7: push (FCM), Google sign-in (Credential Manager), share + deep links.
// Built by tools/plugins/build_plugins.sh; all versions come from tools/plugins/pin.env.
pluginManagement {
    // The block cannot see script variables, so it reads the pin file itself.
    def pinFile = new File(settingsDir, '../tools/plugins/pin.env')
    if (!pinFile.isFile()) {
        throw new GradleException("missing ${pinFile}")
    }
    def pins = new Properties()
    pinFile.withInputStream { pins.load(it) }
    plugins {
        id 'com.android.library' version pins.getProperty('AGP_VERSION')
        id 'org.jetbrains.kotlin.android' version pins.getProperty('KOTLIN_VERSION')
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'craterline-android-plugins'
include ':push', ':signin', ':share'
